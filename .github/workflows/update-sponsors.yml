name: update-sponsors
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_sponsors.py
      - name: Commit fresh index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sponsors.json
          git diff --cached --quiet || git commit -m "Update sponsor index"
          git push
      - name: Open issue on failure
        if: failure()
        run: |
          gh issue list --state open --search "Sponsor index update failed" --json number -q '.[0].number' | grep -q . || \
            gh issue create --title "Sponsor index update failed" \
              --body "The daily sponsor index update failed. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
