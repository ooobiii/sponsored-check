<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --border:#d1d9e0;
    --accent:#1a7f37; --hover:#f6f8fa;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.08);
  }
  body.dark {
    --bg:#1f2328; --fg:#f0f6fc; --muted:#9198a1; --border:#3d444d;
    --accent:#2da44e; --hover:#282e36;
    --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
  }
  body { width:260px; margin:0; padding:16px; border-radius:12px; background:var(--bg); color:var(--fg);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    transition:background .15s,color .15s; }
  .head { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  h1 { font-size:13px; font-weight:600; margin:0; flex:1; }
  .theme-btn { border:none; background:none; cursor:pointer; padding:4px 6px; border-radius:6px;
    color:var(--muted); font-size:15px; line-height:1; transition:background .15s; }
  .theme-btn:hover { background:var(--hover); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .switch { position:relative; width:34px; height:20px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--border); border-radius:999px; transition:.15s; }
  .slider:before { content:""; position:absolute; width:16px; height:16px; left:2px; top:2px;
    background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  input:checked + .slider { background:var(--accent); }
  input:checked + .slider:before { transform:translateX(14px); }
  .primary { width:100%; margin-top:14px; padding:9px 0; border:1px solid var(--border); border-radius:8px;
    background:var(--bg); color:var(--fg); cursor:pointer; font:inherit; transition:background .15s; }
  .primary:hover { background:var(--hover); }
  .bmac { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px;
    color:var(--muted); text-decoration:none; font-size:12px; padding:6px; border-radius:6px;
    transition:background .15s,color .15s; }
  .bmac:hover { background:var(--hover); color:var(--fg); }
  .report { display:block; text-align:center; color:var(--muted); font-size:11px;
    text-decoration:none; margin-top:2px; padding:4px; border-radius:6px; transition:background .15s,color .15s; }
  .report:hover { background:var(--hover); color:var(--fg); text-decoration:underline; }
  #error { color:#cf222e; margin:10px 0 0; font-size:12px; }
  body.dark #error { color:#ff7b72; }
</style>
</head>
<body>
  <div class="head">
    <span class="dot"></span>
    <h1>UK Sponsored Check</h1>
    <button class="theme-btn" id="theme" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
  </div>
  <label class="row">
    <span>Checking enabled</span>
    <span class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></span>
  </label>
  <button class="primary" id="analyse">Analyse this page</button>
  <p id="error" hidden>Couldn't analyse this page.</p>
  <a class="report" href="https://github.com/ooobiii/sponsored-check/issues/new?template=false-verdict.md" target="_blank" rel="noopener">Report an issue</a>
  <a class="bmac" href="https://buymeacoffee.com/ooobiii" target="_blank" rel="noopener">&#9749; Buy me a coffee</a>
  <script src="popup.js"></script>
</body>
</html>
